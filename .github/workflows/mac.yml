name: Multi-OS Remote Environment

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: 'কোন সিস্টেম চালু করতে চান নির্বাচন করুন:'
        required: true
        default: 'macOS'
        type: choice
        options:
          - macOS
          - Windows

jobs:
  run-mac:
    if: ${{ github.event.inputs.os_choice == 'macOS' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Chrome Remote Desktop
        run: |
          brew install --cask chrome-remote-desktop-host

      - name: Setup Remote Access
        run: |
          # CRD_COMMAND থেকে শুধু কোড সংগ্রহ
          CMD="${{ secrets.CRD_COMMAND }}"
          CODE=$(echo "$CMD" | grep -oE '\-\-code="[^"]+"' | cut -d'"' -f2)
          REDIRECT=$(echo "$CMD" | grep -oE '\-\-redirect\-url="[^"]+"' | cut -d'"' -f2)
          NAME=$(echo "$CMD" | grep -oE '\-\-name=[^ ]+' | cut -d'=' -f2)

          if [ -z "$CODE" ]; then
            # যদি সরাসরি সম্পূর্ণ কমান্ড থাকে তবে রান করার চেষ্টা
            eval "$CMD"
          else
            # macOS-এর জন্য সঠিক পাথে সার্ভিস চালু
            /Library/PrivilegedHelperTools/chrome-remote-desktop-host --code="$CODE" --redirect-url="$REDIRECT" --name="$NAME"
          fi

      - name: Keep Alive Session
        run: |
          echo "macOS environment running..."
          sleep 21600
