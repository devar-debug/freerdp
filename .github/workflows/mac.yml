name: Multi-OS Remote Environment

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: 'কোন সিস্টেম চালু করতে চান নির্বাচন করুন:'
        required: true
        default: 'macOS'
        type: choice
        options:
          - macOS
          - Windows

jobs:
  run-mac:
    if: ${{ github.event.inputs.os_choice == 'macOS' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Chrome Remote Desktop
        run: |
          brew install --cask chrome-remote-desktop-host

      - name: Setup Remote Access Command
        run: |
          ${{ secrets.CRD_COMMAND }}

      - name: Keep Alive Session
        run: |
          echo "macOS environment running..."
          sleep 21600
