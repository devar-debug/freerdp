name: Free Windows RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install Tailscale
      run: |
        invoke-webrequest https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -outfile tailscale-setup.exe
        start-process tailscale-setup.exe -argumentlist '/quiet' -wait

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User
      run: |
        net user RDPAdmin Pa$$w0rd1234 /add
        net localgroup administrators RDPAdmin /add

    - name: Keep RDP Alive (Up to 6 Hours)
      run: |
        $Loop = $true
        while ($Loop) {
            Start-Sleep -Seconds 60
        }
