name: Windows 11 RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install Tailscale
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

    - name: Authenticate Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes

    - name: Configure User & Enable RDP
      run: |
        $Password = ConvertTo-SecureString "987654321" -AsPlainText -Force
        New-LocalUser "Pipilika" -Password $Password -FullName "Pipilika Host IT" -Description "RDP Admin User"
        Add-LocalGroupMember -Group "Administrators" -Member "Pipilika"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Keep RDP Alive (6 Hours)
      run: |
        $timeout = 21600 # 6 hours in seconds
        $interval = 30
        $elapsed = 0
        while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds $interval
            $elapsed += $interval
            Write-Host "RDP Active: $elapsed seconds elapsed..."
        }
