name: Windows 11 RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download and Install Tailscale
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

    - name: Connect to Tailscale
      shell: powershell
      run: |
        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        if (Test-Path $tailscalePath) {
            & $tailscalePath up --authkey "tskey-auth-kvws7bDTj821CNTRL-FRM4ADgWrvRHknDscP8YvRdq4rFHSgYj" --accept-routes
        } else {
            Write-Error "Tailscale executable not found!"
        }

    - name: Configure RDP
      shell: powershell
      run: |
        net user Pipilika SecurePass1! /add
        net localgroup Administrators Pipilika /add
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Keep Alive
      shell: powershell
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
